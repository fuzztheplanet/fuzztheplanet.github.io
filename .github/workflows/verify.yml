# The deploy workflow publishes the committed www/ as is, without building
# anything. This one rebuilds the site from the sources and fails when the
# result is not what was committed, which is what a push that edits src/ without
# running "make" looks like. It reports; it does not hold the deployment back.
name: Verify the committed build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The comparison is byte for byte, so the toolchain has to be the one the
    # site is built with: Arch's emacs-nox and the Org it bundles, plus the
    # current htmlize and ox-rss. This follows Arch on purpose. A failure whose
    # diff is only the <generator> line of rss.xml means the two toolchains
    # have drifted apart, not that the site is stale.
    container: archlinux:latest
    # Without a UTF-8 locale Emacs would guess at the encoding of the files it
    # writes. Which one does not matter otherwise: publish-website.el pins the
    # sort order and the time zone itself, precisely so that the container's
    # C locale and UTC build the same bytes as a laptop in Paris.
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      # git has to be there before the checkout, or the action falls back to
      # downloading an archive that has no history to compare against.
      - name: Install Emacs, git and make
        run: pacman -Syu --noconfirm --needed emacs-nox git make

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each package comes from the archive the local build uses. Left to
      # itself, package.el would take htmlize from MELPA, whose date-based
      # snapshot versions always outrank NonGNU ELPA's 1.59.
      - name: Install htmlize and ox-rss
        run: |
          emacs -Q --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (setq package-pinned-packages '((htmlize . \"nongnu\") (ox-rss . \"melpa\")))
            (package-initialize)
            (package-refresh-contents)
            (package-install 'htmlize)
            (package-install 'ox-rss))"

      - name: Show the toolchain
        run: |
          emacs -Q --batch --eval "(progn
            (require 'package)
            (package-initialize)
            (require 'org)
            (dolist (name '(htmlize ox-rss))
              (princ (format \"%s %s\n\" name
                             (package-version-join
                              (package-desc-version
                               (cadr (assq name package-alist)))))))
            (princ (format \"Emacs %s, Org %s\n\" emacs-version (org-version))))"

      - name: Rebuild the site
        run: make all

      - name: Compare with what is committed
        run: |
          # The checkout belongs to another user than the one the container
          # runs as, which git refuses to work with unless told otherwise.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff
            echo "::error::www/ is not what the sources build to. Run 'make update' and commit the result."
            exit 1
          fi
          echo "www/ matches a fresh build."
